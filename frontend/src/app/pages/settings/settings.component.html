<p-toast />

<div class="page-content">

  <div class="page-header">
    <div style="display:flex;align-items:center;gap:0.75rem">
      <div class="page-icon"><i class="pi pi-cog"></i></div>
      <div>
        <h1 class="page-header__title">Paramètres</h1>
        <p class="page-header__sub">Configuration de l'application</p>
      </div>
    </div>
  </div>

  <form [formGroup]="form" (ngSubmit)="save()" style="max-width:600px">

    <div class="form-card form-card--anim" style="--card-i:0">
      <div class="form-card__header">
        <div class="form-card__icon"><i class="pi pi-tag"></i></div>
        <span class="form-card__title">Tarifs de consigne</span>
      </div>
      <div class="form-card__body">

        @if (loading) {
          <div style="padding:1rem 0">
            @for (_ of [1,2]; track $index) {
              <div style="height:2.5rem;border-radius:8px;background:var(--surface-200);animation:skeleton 1.2s infinite alternate;margin-bottom:1rem"></div>
            }
          </div>
        } @else {
          <div class="field">
            <label>Consigne palette plastique <span style="color:var(--text-color-secondary);font-weight:400">(DA / palette)</span></label>
            <p-inputnumber formControlName="consigne_plastique"
              [min]="0" [showButtons]="true" buttonLayout="horizontal"
              incrementButtonIcon="pi pi-plus" decrementButtonIcon="pi pi-minus"
              suffix=" DA" [style]="{width:'100%'}" />
          </div>

          <div class="field mb-0">
            <label>Consigne palette bois <span style="color:var(--text-color-secondary);font-weight:400">(DA / palette)</span></label>
            <p-inputnumber formControlName="consigne_bois"
              [min]="0" [showButtons]="true" buttonLayout="horizontal"
              incrementButtonIcon="pi pi-plus" decrementButtonIcon="pi pi-minus"
              suffix=" DA" [style]="{width:'100%'}" />
          </div>
        }

      </div>
    </div>

    <div style="display:flex;justify-content:flex-end;margin-top:1rem">
      <p-button label="Enregistrer" icon="pi pi-check" type="submit"
        [disabled]="form.invalid || saving || loading" [loading]="saving" />
    </div>

  </form>

</div>
