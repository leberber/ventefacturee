<p-toast />
<p-confirmdialog />

<div class="page-content">

  <!-- Toolbar -->
  <p-toolbar styleClass="mb-4">
    <ng-template #start>
      <h2 class="page-title">Chauffeurs&nbsp;<small style="font-size:14px;font-weight:400;color:#6b7280">({{ chauffeurs.length }})</small></h2>
    </ng-template>
    <ng-template #end>
      <p-iconfield>
        <p-inputicon class="pi pi-search" />
        <input pInputText [(ngModel)]="searchQuery" (ngModelChange)="load()" placeholder="Rechercher…" style="width:200px">
      </p-iconfield>
      <p-button label="Ajouter" icon="pi pi-plus" (onClick)="openAdd()" styleClass="ml-2" />
    </ng-template>
  </p-toolbar>

  <!-- Table -->
  <p-table
    [value]="chauffeurs"
    [loading]="loading"
    styleClass="p-datatable-sm p-datatable-striped"
    [paginator]="true"
    [rows]="20"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} sur {totalRecords}"
  >
    <ng-template #header>
      <tr>
        <th pSortableColumn="name">Nom <p-sortIcon field="name" /></th>
        <th>Téléphone</th>
        <th>BLs effectués</th>
        <th style="width:120px">Actions</th>
      </tr>
    </ng-template>
    <ng-template #body let-c>
      <tr>
        <td><strong>{{ c.name }}</strong></td>
        <td>{{ c.phone || '—' }}</td>
        <td>
          <p-tag [value]="(c.bl_count ?? 0).toString()" severity="secondary" />
        </td>
        <td>
          <div style="display:flex;gap:4px">
            <p-button icon="pi pi-pencil" size="small" severity="secondary" (onClick)="openEdit(c)" />
            <p-button icon="pi pi-trash"  size="small" severity="danger"    (onClick)="confirmDelete(c)" />
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr><td colspan="4" style="text-align:center;padding:32px;color:#9ca3af">
        {{ searchQuery ? 'Aucun résultat pour "' + searchQuery + '"' : 'Aucun chauffeur enregistré' }}
      </td></tr>
    </ng-template>
  </p-table>

</div>

<!-- Dialog: Add / Edit -->
<p-dialog
  [(visible)]="dialogVisible"
  [header]="editingId ? 'Modifier le chauffeur' : 'Ajouter un chauffeur'"
  [modal]="true"
  [style]="{width:'400px'}"
  [draggable]="false"
>
  <form [formGroup]="form" (ngSubmit)="save()">
    <div class="field">
      <label>Nom <span style="color:red">*</span></label>
      <input pInputText formControlName="name" placeholder="Nom du chauffeur" class="w-full">
    </div>
    <div class="field mb-0">
      <label>Téléphone</label>
      <input pInputText formControlName="phone" placeholder="0550 000 000" class="w-full">
    </div>
  </form>
  <ng-template #footer>
    <p-button label="Annuler"     severity="secondary" (onClick)="dialogVisible = false" />
    <p-button label="Enregistrer" icon="pi pi-check"   (onClick)="save()" [disabled]="form.invalid" />
  </ng-template>
</p-dialog>
