<p-toast />

<div class="page-content">

  <h2 class="page-title" style="margin-bottom:24px">Retour d'expédition</h2>

  <div style="max-width:760px">
    <form [formGroup]="form" (ngSubmit)="save()">

      <!-- Client + Chauffeur -->
      <div class="form-grid-2">
        <div class="field">
          <label>Client <span style="color:red">*</span></label>
          <p-select
            formControlName="client_id"
            [options]="clients"
            optionLabel="label"
            optionValue="value"
            placeholder="Sélectionner un client"
            [filter]="true"
            filterPlaceholder="Rechercher…"
            [style]="{width:'100%'}"
          />
        </div>
        <div class="field">
          <label>Chauffeur <span style="color:red">*</span></label>
          <p-select
            formControlName="chauffeur_id"
            [options]="chauffeurs"
            optionLabel="label"
            optionValue="value"
            placeholder="Sélectionner un chauffeur"
            [filter]="true"
            filterPlaceholder="Rechercher…"
            [style]="{width:'100%'}"
          />
        </div>
      </div>

      <!-- Solde actuel -->
      @if (selectedClient) {
        <div class="balance-box" style="margin-bottom:24px">
          <div class="balance-title">Solde actuel — {{ selectedClient.name }}</div>
          <div class="balance-grid">
            <div class="balance-item">
              <span class="balance-label">🔵 Plastique total dû</span>
              <p-tag [value]="plasticBalance.toString()" [severity]="plasticBalance > 0 ? 'info' : 'success'" />
            </div>
            <div class="balance-item">
              <span class="balance-label">Dont consignées</span>
              <p-tag [value]="plasticConsigne.toString()" severity="info" />
            </div>
            <div class="balance-item">
              <span class="balance-label">🟫 Bois total dû</span>
              <p-tag [value]="woodBalance.toString()" [severity]="woodBalance > 0 ? 'warn' : 'success'" />
            </div>
            <div class="balance-item">
              <span class="balance-label">Dont consignées</span>
              <p-tag [value]="woodConsigne.toString()" severity="warn" />
            </div>
          </div>
        </div>
      }

      <!-- Palettes retournées -->
      <div class="palette-section">
        <div class="palette-section-title">Palettes retournées</div>
        <div class="form-grid-2">
          <div class="field">
            <label>🔵 Plastique retournées</label>
            <p-inputnumber formControlName="retour_plastique" [min]="0" [showButtons]="true" buttonLayout="horizontal"
              decrementButtonIcon="pi pi-minus" incrementButtonIcon="pi pi-plus"
              [style]="{width:'100%'}" />
          </div>
          <div class="field">
            <label>🟫 Bois retournées</label>
            <p-inputnumber formControlName="retour_bois" [min]="0" [showButtons]="true" buttonLayout="horizontal"
              decrementButtonIcon="pi pi-minus" incrementButtonIcon="pi pi-plus"
              [style]="{width:'100%'}" />
          </div>
        </div>
      </div>

      <!-- Notes -->
      <div class="field">
        <label>Notes (optionnel)</label>
        <input pInputText formControlName="notes" placeholder="Remarques…" class="w-full">
      </div>

      <!-- Actions -->
      <div style="display:flex;gap:8px;margin-top:8px">
        <p-button label="Annuler"             severity="secondary" type="button" (onClick)="reset()" />
        <p-button label="Enregistrer le retour" icon="pi pi-check" type="submit"
          [disabled]="form.invalid || saving" [loading]="saving" />
      </div>

    </form>
  </div>

</div>
