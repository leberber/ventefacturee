<p-toast />
<p-confirmdialog />

<div class="page-content">

  <!-- Toolbar -->
  <p-toolbar styleClass="mb-4">
    <ng-template #start>
      <h2 class="page-title">Livreurs&nbsp;<small style="font-size:14px;font-weight:400;color:#6b7280">({{ livreurs.length }})</small></h2>
    </ng-template>
    <ng-template #end>
      <p-iconfield>
        <p-inputicon class="pi pi-search" />
        <input pInputText [(ngModel)]="searchQuery" (ngModelChange)="load()" placeholder="Rechercher…" style="width:200px">
      </p-iconfield>
      <p-button label="Ajouter" icon="pi pi-plus" (onClick)="openAdd()" styleClass="ml-2" />
    </ng-template>
  </p-toolbar>

  <!-- Table -->
  <p-table
    [value]="livreurs"
    [loading]="loading"
    styleClass="p-datatable-sm p-datatable-striped"
    [paginator]="true"
    [rows]="20"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} sur {totalRecords}"
  >
    <ng-template #header>
      <tr>
        <th pSortableColumn="name">Nom <p-sortIcon field="name" /></th>
        <th>Téléphone</th>
        <th style="width:120px">Actions</th>
      </tr>
    </ng-template>
    <ng-template #body let-l>
      <tr>
        <td><strong>{{ l.name }}</strong></td>
        <td>{{ l.phone || '—' }}</td>
        <td>
          <div style="display:flex;gap:4px">
            <p-button icon="pi pi-pencil" size="small" severity="secondary" (onClick)="openEdit(l)" />
            <p-button icon="pi pi-trash"  size="small" severity="danger"    (onClick)="confirmDelete(l)" />
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr><td colspan="3" style="text-align:center;padding:32px;color:#9ca3af">
        {{ searchQuery ? 'Aucun résultat pour "' + searchQuery + '"' : 'Aucun livreur enregistré' }}
      </td></tr>
    </ng-template>
  </p-table>

</div>
