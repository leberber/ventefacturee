<p-toast />

<div class="page-content">

  <div class="page-header" style="margin-bottom:1.5rem">
    <div style="display:flex;align-items:center;gap:0.75rem">
      <div class="page-icon"><i class="pi pi-truck"></i></div>
      <div>
        <h1 class="page-header__title">{{ editingId ? 'Modifier le livreur' : 'Nouveau livreur' }}</h1>
        @if (editingId) {
          <p class="page-header__sub">{{ form.get('name')?.value || '—' }}</p>
        }
      </div>
    </div>
    <button class="back-btn" type="button" (click)="cancel()">
      <i class="pi pi-arrow-left"></i>
      <span>Retour</span>
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="save()" style="padding-bottom:5rem">

    <div class="form-card form-card--anim" style="--card-i:0">
      <div class="form-card__header">
        <div class="form-card__icon form-card__icon--indigo"><i class="pi pi-truck"></i></div>
        <span class="form-card__title">Identification</span>
      </div>
      <div class="form-card__body">
        <div class="form-grid-2">
          <div class="field">
            <label>Nom <span style="color:red">*</span></label>
            <input pInputText formControlName="name" placeholder="Nom du livreur" class="w-full">
          </div>
          <div class="field">
            <label>Téléphone</label>
            <input pInputText formControlName="phone" placeholder="0550 000 000" class="w-full">
          </div>
        </div>
      </div>
    </div>

    <div class="form-footer">
      <p-button label="Annuler"     severity="secondary" [text]="true" type="button" (onClick)="cancel()" />
      <p-button label="Enregistrer" icon="pi pi-check"   type="submit"
        [disabled]="form.invalid || saving" [loading]="saving" />
    </div>

  </form>
</div>
