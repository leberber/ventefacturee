<p-toast />

<div class="page-content">

  <!-- Header -->
  <div class="page-header" style="margin-bottom:1.5rem">
    <div style="display:flex;align-items:center;gap:0.75rem">
      <div class="page-icon"><i class="pi pi-user"></i></div>
      <div>
        <h1 class="page-header__title">{{ editingId ? 'Modifier le client' : 'Nouveau client' }}</h1>
        @if (editingId) {
          <p class="page-header__sub">{{ form.get('name')?.value || '—' }}</p>
        }
      </div>
    </div>
    <button class="back-btn" type="button" (click)="cancel()">
      <i class="pi pi-arrow-left"></i>
      <span>Retour</span>
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="save()">
    <div class="cf-layout">

      <!-- Left: stacked form cards -->
      <div class="cf-fields">

        <!-- Identification card -->
        <div class="form-card form-card--anim" style="--card-i:0">
          <div class="form-card__header">
            <div class="form-card__icon form-card__icon--indigo"><i class="pi pi-user"></i></div>
            <span class="form-card__title">Identification</span>
          </div>
          <div class="form-card__body">
            <div class="form-grid-2">
              <div class="field">
                <label>Prénom</label>
                <input pInputText formControlName="first_name" placeholder="Prénom" class="w-full">
              </div>
              <div class="field">
                <label>Nom de famille</label>
                <input pInputText formControlName="last_name" placeholder="Nom" class="w-full">
              </div>
            </div>
            <div class="field">
              <label>Nom du magasin</label>
              <input pInputText formControlName="store_name" placeholder="Épicerie, commerce…" class="w-full">
            </div>
            <div class="form-grid-3">
              <div class="field">
                <label>Téléphone</label>
                <input pInputText formControlName="phone" placeholder="0550 000 000" class="w-full">
              </div>
              <div class="field">
                <label>Code client</label>
                <input pInputText formControlName="code" placeholder="ex: 000146" class="w-full">
              </div>
              <div class="field">
                <label>Catégorie <span style="color:red">*</span></label>
                <p-select formControlName="category" [options]="categoryOptions"
                  optionLabel="label" optionValue="value" [style]="{width:'100%'}" appendTo="body" />
              </div>
            </div>
          </div>
        </div>

        <!-- Codes & Référencement card -->
        <div class="form-card form-card--anim" style="--card-i:1">
          <div class="form-card__header">
            <div class="form-card__icon form-card__icon--amber"><i class="pi pi-barcode"></i></div>
            <span class="form-card__title">Codes & Référencement</span>
          </div>
          <div class="form-card__body">
            <div class="form-grid-3">
              <div class="field">
                <label>N° client (BDD)</label>
                <input pInputText formControlName="customer_no" placeholder="CustomerNo" class="w-full">
              </div>
              <div class="field">
                <label>Code Sodichn</label>
                <input pInputText formControlName="code_sodichn" placeholder="ex: 1501-CL001" class="w-full">
              </div>
              <div class="field">
                <label>Route ID</label>
                <input pInputText formControlName="route_id" placeholder="ex: R01" class="w-full">
              </div>
            </div>
            <div class="field">
              <label>Nom Sodichn (Tiers)</label>
              <input pInputText formControlName="nom_sodichn" placeholder="Nom tel qu'enregistré dans Sodichn" class="w-full">
            </div>
          </div>
        </div>

        <!-- Classification card -->
        <div class="form-card form-card--anim" style="--card-i:2">
          <div class="form-card__header">
            <div class="form-card__icon form-card__icon--purple"><i class="pi pi-tag"></i></div>
            <span class="form-card__title">Classification</span>
          </div>
          <div class="form-card__body">
            <div class="form-grid-3">
              <div class="field">
                <label>Type client</label>
                <input pInputText formControlName="type_client" placeholder="ex: GROSSISTE" class="w-full">
              </div>
              <div class="field">
                <label>Catégorie BDD</label>
                <input pInputText formControlName="categorie_bdd" placeholder="ex: A" class="w-full">
              </div>
              <div class="field">
                <label>Tarification</label>
                <input pInputText formControlName="tarification" placeholder="ex: T1" class="w-full">
              </div>
              <div class="field">
                <label>Vendeur</label>
                <input pInputText formControlName="vendeur" placeholder="Nom du vendeur" class="w-full">
              </div>
              <div class="field">
                <label>BUID</label>
                <input pInputText formControlName="buid" placeholder="ex: BU01" class="w-full">
              </div>
            </div>
          </div>
        </div>

        <!-- Fiscal card -->
        <div class="form-card form-card--anim" style="--card-i:3">
          <div class="form-card__header">
            <div class="form-card__icon form-card__icon--teal"><i class="pi pi-file"></i></div>
            <span class="form-card__title">Informations fiscales</span>
          </div>
          <div class="form-card__body">
            <div class="form-grid-3">
              <div class="field">
                <label>RC</label>
                <input pInputText formControlName="rc" placeholder="Registre de commerce" class="w-full">
              </div>
              <div class="field">
                <label>NIF</label>
                <input pInputText formControlName="nif" placeholder="N° d'identification fiscale" class="w-full">
              </div>
              <div class="field">
                <label>AI</label>
                <input pInputText formControlName="ai" placeholder="Article d'imposition" class="w-full">
              </div>
            </div>
            <div class="field">
              <label>Activité</label>
              <input pInputText formControlName="activite_sodichn" placeholder="Activité principale" class="w-full">
            </div>
          </div>
        </div>

        <!-- Localisation card (fields only) -->
        <div class="form-card form-card--anim" style="--card-i:4">
          <div class="form-card__header">
            <div class="form-card__icon form-card__icon--teal"><i class="pi pi-map-marker"></i></div>
            <span class="form-card__title">Localisation</span>
            <span class="wilaya-badge"><i class="pi pi-map"></i> Wilaya de Tizi-Ouzou</span>
          </div>
          <div class="form-card__body">
            <div class="form-grid-2">
              <div class="field">
                <label>Wilaya</label>
                <input pInputText formControlName="wilaya" placeholder="ex: Tizi-Ouzou" class="w-full">
              </div>
              <div class="field">
                <label>Région</label>
                <input pInputText formControlName="region" placeholder="ex: Centre" class="w-full">
              </div>
            </div>
            <div class="form-grid-2">
              <div class="field">
                <label>Daïra</label>
                <p-select
                  formControlName="daira"
                  [options]="dairaOptions"
                  optionLabel="label"
                  optionValue="value"
                  placeholder="Sélectionner une daïra"
                  [filter]="true"
                  filterPlaceholder="Rechercher…"
                  [showClear]="true"
                  [style]="{width:'100%'}"
                  appendTo="body"
                  (onChange)="onDairaChange($event.value)"
                />
              </div>
              <div class="field">
                <label>Commune</label>
                <p-select
                  formControlName="commune"
                  [options]="communeOptions"
                  optionLabel="label"
                  optionValue="value"
                  placeholder="Sélectionner une commune"
                  [filter]="true"
                  filterPlaceholder="Rechercher…"
                  [showClear]="true"
                  [style]="{width:'100%'}"
                  appendTo="body"
                  [disabled]="!form.get('daira')?.value"
                  (onChange)="onCommuneChange($event.value)"
                />
              </div>
              <div class="field" style="grid-column:1/-1">
                <label>Adresse</label>
                <input pInputText formControlName="address" placeholder="Rue, quartier, numéro…" class="w-full">
              </div>
            </div>
            <div class="loc-divider">
              <i class="pi pi-map-marker"></i>
              <span>Coordonnées GPS <em style="font-style:normal;font-weight:400;text-transform:none;letter-spacing:0;color:var(--text-color-secondary)">(optionnel)</em></span>
            </div>
            <div class="form-grid-2">
              <div class="field">
                <label>Latitude</label>
                <p-inputnumber formControlName="latitude" [minFractionDigits]="6" [maxFractionDigits]="8"
                  [showClear]="true" placeholder="36.752887" [style]="{width:'100%'}" />
              </div>
              <div class="field">
                <label>Longitude</label>
                <p-inputnumber formControlName="longitude" [minFractionDigits]="6" [maxFractionDigits]="8"
                  [showClear]="true" placeholder="4.042048" [style]="{width:'100%'}" />
              </div>
            </div>
          </div>
        </div>

      </div><!-- /cf-fields -->

      <!-- Right: sticky map panel -->
      <div class="cf-map">
        <!-- Mobile-only bar: commune + locate -->
        <div class="cf-mob-bar mob-only">
          <p-select formControlName="daira" [options]="dairaOptions"
            optionLabel="label" optionValue="value"
            placeholder="Daïra…"
            [filter]="true"
            filterPlaceholder="Rechercher…"
            [showClear]="true"
            [style]="{flex:'1',minWidth:'0'}"
            appendTo="body"
            (onChange)="onDairaChange($event.value)"
          />
          <button type="button" class="cf-locate-btn" (click)="locateMe()" title="Ma position">
            <i class="pi pi-crosshairs"></i>
            <span>Ma position</span>
          </button>
        </div>
        <app-map-picker
          [initialLat]="initialLat"
          [initialLng]="initialLng"
          (locationPicked)="onMapPick($event)"
        />
      </div>

    </div><!-- /cf-layout -->

    <!-- Fixed footer -->
    <div class="form-footer">
      <p-button label="Annuler"     severity="secondary" [text]="true" type="button" (onClick)="cancel()" />
      <p-button label="Enregistrer" icon="pi pi-check"   type="submit"
        [disabled]="form.invalid || saving" [loading]="saving" />
    </div>

  </form>
</div>
