<div class="admin-shell" [class.admin-shell--collapsed]="collapsed()">

  <!-- Sidebar -->
  <aside class="admin-sidebar">

    <!-- Logo -->
    <div class="admin-sidebar__logo">
      <img src="assets/logo.png" alt="CLR Freha" class="sidebar-logo-full" />
    </div>

    <!-- Nav -->
    <nav class="admin-sidebar__nav">
      <a class="nav-item" routerLink="/dashboard" routerLinkActive="active">
        <i class="pi pi-home"></i><span>Tableau de bord</span>
      </a>

      @if(isAdminOrEmploye) {
        <a class="nav-item nav-item--accent" routerLink="/expedition" routerLinkActive="active">
          <i class="pi pi-file-plus"></i><span>Enregistrer une expédition</span>
        </a>
        <a class="nav-item" routerLink="/retour" routerLinkActive="active">
          <i class="pi pi-replay"></i><span>Enregistrer un retour</span>
        </a>
        <a class="nav-item" routerLink="/clients" routerLinkActive="active">
          <i class="pi pi-users"></i><span>Clients</span>
        </a>
        <a class="nav-item" routerLink="/chauffeurs" routerLinkActive="active">
          <i class="pi pi-id-card"></i><span>Chauffeurs</span>
        </a>
        <a class="nav-item" routerLink="/livreurs" routerLinkActive="active">
          <i class="pi pi-truck"></i><span>Livreurs</span>
        </a>
        <a class="nav-item" routerLink="/historique" routerLinkActive="active">
          <i class="pi pi-list"></i><span>Historique BLs</span>
        </a>
        @if(isAdmin) {
          <a class="nav-item" routerLink="/utilisateurs" routerLinkActive="active">
            <i class="pi pi-shield"></i><span>Fonctionnaires</span>
          </a>
        }
        <a class="nav-item" routerLink="/parametres" routerLinkActive="active">
          <i class="pi pi-cog"></i><span>Paramètres</span>
        </a>
      }
    </nav>

    <!-- Collapse toggle -->
    <button class="sidebar-toggle" type="button" (click)="collapsed.set(!collapsed())">
      <i [class]="collapsed() ? 'pi pi-chevron-right' : 'pi pi-chevron-left'"></i>
    </button>

    <!-- Footer: user info + logout -->
    <div class="admin-sidebar__footer">
      <div class="admin-sidebar__footer-icon">
        <i class="pi pi-user"></i>
      </div>
      <div class="admin-sidebar__footer-text">
        <strong>{{ user?.full_name }}</strong>
        <span>{{ user?.role | titlecase }}</span>
      </div>
      <button class="sidebar-logout" type="button" (click)="logout()" title="Se déconnecter">
        <i class="pi pi-sign-out"></i>
      </button>
    </div>

  </aside>

  <!-- Main content -->
  <main class="admin-content">
    <router-outlet />
  </main>

</div>
